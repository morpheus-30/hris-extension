<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Estimated Out Time — Settings</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      font-family: "Times New Roman", serif;
      background: #ffffff;
      color: #000064;
    }

    header {
      background: gray;
      color: white;
      font-size: 13px;
      text-align: center;
      padding: 8px 0;
    }

    .content {
      padding: 12px 16px 16px;
    }

    section {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ddd;
    }

    section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    h2 {
      font-size: 12px;
      margin: 0 0 8px;
      color: gray;
      font-weight: bold;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      font-family: "Times New Roman", serif;
      font-size: 13px;
      padding: 4px 6px;
      border: 1px solid gray;
      border-radius: 2px;
      margin-bottom: 8px;
    }

    button {
      padding: 6px 10px;
      background: #b6cde5;
      border: 1px solid gray;
      border-radius: 2px;
      font-family: "Times New Roman", serif;
      font-size: 12px;
      cursor: pointer;
    }

    button:active {
      background: #9cb9d9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .row button {
      flex: 1;
    }

    #getDetailsBtn {
      width: 100%;
      padding: 8px 0;
      font-size: 13px;
      background: #32cd32;
      color: white;
      font-weight: bold;
    }

    #getDetailsBtn:active {
      background: #28a428;
    }

    #credStatus,
    #saveStatus,
    #shortLeaveStatus {
      margin-top: 4px;
      font-size: 11px;
      min-height: 14px;
    }

    #result {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    #result .estimate {
      font-weight: bold;
      color: #b35c00;
    }

    #result .error {
      color: #cc0000;
    }

    #shortLeaveSelector {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    #shortLeaveSelector button {
      width: 28px;
      padding: 4px 0;
      font-weight: bold;
    }

    #shortLeaves {
      min-width: 20px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .note {
      font-size: 10px;
      color: gray;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <header>Estimated Out Time</header>
  <div class="content">
    <section>
      <h2>Required work duration</h2>
      <label for="requiredHours">HH:MM</label>
      <input type="text" id="requiredHours" placeholder="08:30" />
      <button id="saveHours">Save</button>
      <div id="saveStatus"></div>
    </section>

    <section>
      <h2>HRIS login (stored on this device only)</h2>
      <label for="userId">User Id</label>
      <input type="text" id="userId" autocomplete="off" />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="off" />
      <div class="row">
        <button id="saveCreds">Save</button>
        <button id="clearCreds">Clear</button>
      </div>
      <div id="credStatus"></div>
      <div class="note">
        Stored unencrypted in this browser's local extension storage — never
        synced to your Google account or sent anywhere except the HRIS login
        form itself.
      </div>
    </section>

    
    <section>
      <button id="getDetailsBtn">Get Details</button>
      <div id="result">No data fetched yet.</div>
      <div id="shortLeaveSelector">
        <button id="decreaseShortLeave">−</button>
        <div id="shortLeaves">0</div>
        <button id="increaseShortLeave">+</button>
      </div>
    </section>

    <section>
      <h2>Short leave</h2>
      <label for="shortLeaveMinutesInput">Duration of one short leave (minutes)</label>
      <input type="text" id="shortLeaveMinutesInput" placeholder="50" />
      <button id="saveShortLeaveMinutes">Save</button>
      <div id="shortLeaveStatus"></div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>

</html>
